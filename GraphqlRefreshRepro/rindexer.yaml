name: GraphqlRefreshRepro
project_type: no-code
networks:
- name: ethereum
  chain_id: 1
  rpc: https://mainnet.gateway.tenderly.co
storage:
  postgres:
    enabled: true
    # FK Approval.value -> Transfer.value. Tables stay empty on this range, so
    # the unique constraint and the foreign key both apply. PostGraphile only
    # exposes that relation if it sees the constraint.
    relationships:
    - contract_name: RocketPoolETH
      event_name: Approval
      event_input_name: value
      linked_to:
      - contract_name: RocketPoolETH
        event_name: Transfer
        event_input_name: value
    # With filter_only_on_indexed_columns, the owner filter exists only if this
    # index was visible at introspection time.
    indexes:
      contracts:
      - name: RocketPoolETH
        events:
        - name: Approval
          indexes:
          - event_input_names:
            - owner
graphql:
  port: 3001
  filter_only_on_indexed_columns: true
native_transfers:
  enabled: false
contracts:
- name: RocketPoolETH
  details:
  - network: ethereum
    address: 0xae78736cd615f374d3085123a210448e74fc6393
    # One block, before this contract exists. Historic is a single empty
    # getLogs, so indexes and relationships are applied before GraphQL is up.
    start_block: '1'
    end_block: '1'
  abi: ./abis/RocketTokenRETH.abi.json
  include_events:
  - name: Transfer
  - name: Approval
global:
  health_port: 8080
